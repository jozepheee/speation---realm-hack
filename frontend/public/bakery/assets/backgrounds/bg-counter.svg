<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 360" width="1920" height="360">
  <!-- Stand-in wooden counter in the art kit style. Replace with bg-counter.png when the final art is ready. -->
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- counter top -->
  <rect x="0" y="0" width="1920" height="52" fill="#ebc79c"/>
  <rect x="0" y="6" width="1920" height="8" fill="#f2d5ae"/>
  <rect x="0" y="52" width="1920" height="14" fill="#cf9f6b"/>

  <!-- counter front -->
  <rect x="0" y="66" width="1920" height="294" fill="#e2b886"/>
  <g fill="#d9ab76">
    <rect x="60" y="100" width="380" height="230" rx="16"/>
    <rect x="500" y="100" width="380" height="230" rx="16"/>
    <rect x="940" y="100" width="380" height="230" rx="16"/>
    <rect x="1380" y="100" width="380" height="230" rx="16"/>
  </g>
  <g fill="#e6be8e">
    <rect x="76" y="116" width="348" height="198" rx="12"/>
    <rect x="516" y="116" width="348" height="198" rx="12"/>
    <rect x="956" y="116" width="348" height="198" rx="12"/>
    <rect x="1396" y="116" width="348" height="198" rx="12"/>
  </g>

  <!-- tea towel hanging over the edge -->
  <!-- drawn as plain stripes (not an SVG pattern), because Safari shows patterns in CSS backgrounds as black -->
  <path d="M150 20 L380 20 L392 250 Q300 262 160 248 Z" fill="#f7f1fb"/>
  <path d="M150.0 20.0 L167.7 20.0 L177.8 248.0 L159.9 248.0 Z" fill="#d9c7f3" opacity="0.7"/>
  <path d="M185.4 20.0 L203.1 20.0 L213.4 248.0 L195.6 248.0 Z" fill="#d9c7f3" opacity="0.7"/>
  <path d="M220.8 20.0 L238.5 20.0 L249.1 248.0 L231.3 248.0 Z" fill="#d9c7f3" opacity="0.7"/>
  <path d="M256.2 20.0 L273.8 20.0 L284.8 248.0 L267.0 248.0 Z" fill="#d9c7f3" opacity="0.7"/>
  <path d="M291.5 20.0 L309.2 20.0 L320.5 248.0 L302.7 248.0 Z" fill="#d9c7f3" opacity="0.7"/>
  <path d="M326.9 20.0 L344.6 20.0 L356.2 248.0 L338.4 248.0 Z" fill="#d9c7f3" opacity="0.7"/>
  <path d="M362.3 20.0 L380.0 20.0 L391.9 248.0 L374.1 248.0 Z" fill="#d9c7f3" opacity="0.7"/>
  <path d="M150.8 38.0 L380.9 38.0 L381.9 56.0 L151.6 56.0 Z" fill="#d9c7f3" opacity="0.7"/>
  <path d="M152.3 74.0 L382.8 74.0 L383.8 92.0 L153.1 92.0 Z" fill="#d9c7f3" opacity="0.7"/>
  <path d="M153.9 110.0 L384.7 110.0 L385.6 128.0 L154.7 128.0 Z" fill="#d9c7f3" opacity="0.7"/>
  <path d="M155.5 146.0 L386.6 146.0 L387.5 164.0 L156.3 164.0 Z" fill="#d9c7f3" opacity="0.7"/>
  <path d="M157.0 182.0 L388.5 182.0 L389.4 200.0 L157.8 200.0 Z" fill="#d9c7f3" opacity="0.7"/>
  <path d="M158.6 218.0 L390.3 218.0 L391.3 236.0 L159.4 236.0 Z" fill="#d9c7f3" opacity="0.7"/>
  <path d="M150 20 L380 20 L382 58 L152 58 Z" fill="#cbb4ef" opacity="0.55"/>

  <!-- blurry plants in the front corners for depth -->
  <g filter="url(#soft)" opacity="0.85">
    <ellipse cx="40" cy="300" rx="70" ry="140" fill="#6f9d58" transform="rotate(-25 40 300)"/>
    <ellipse cx="120" cy="330" rx="56" ry="120" fill="#5f8e4b" transform="rotate(20 120 330)"/>
    <ellipse cx="1880" cy="310" rx="70" ry="140" fill="#6f9d58" transform="rotate(25 1880 310)"/>
  </g>
</svg>
