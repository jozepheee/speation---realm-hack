# Separate deployment configuration: never layer the development database or ports.
# Supply an external authenticated bolt+s:// Memgraph and the hosted Supabase URL.
name: speation
services:
  redis:
    image: redis:7-alpine
    command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, noeviction, --save, "", --appendonly, "no"]
    networks: [services]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 3

  backend: &backend
    image: speation-api:local
    build: ./backend
    env_file: ["${SPEATION_RUNTIME_ENV:-./.env}"]
    environment:
      APP_ENV: production
      AUTH_PROVIDER: supabase
      ENABLE_LEGACY_RESEARCH_ROUTES: "false"
      REDIS_URL: redis://redis:6379/0
      DATABASE_CA_CERT: /app/certs/supabase-ca.crt
      AUDIO_STORAGE_DIR: /app/private-audio
      ALLOWED_ORIGINS: '["https://${SPEATION_PUBLIC_HOST:?Set the public DNS hostname}"]'
    command: [uvicorn, "main:app", --host, 0.0.0.0, --port, "8000", --proxy-headers, --forwarded-allow-ips, "*", --no-access-log]
    networks: [services]
    volumes: [private_audio:/app/private-audio]
    tmpfs: [/tmp:size=256m,mode=1777]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=8)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  worker:
    <<: *backend
    command: [python, -u, -m, scripts.care_worker, --health-file, /tmp/care-worker-health.json]
    healthcheck:
      test: [CMD, python, -m, scripts.worker_health, /tmp/care-worker-health.json]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  frontend:
    image: speation-web:local
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
        NEXT_PUBLIC_BACKEND_URL: https://${SPEATION_PUBLIC_HOST:?Set the public DNS hostname}/api
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set the public Supabase URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set the public anon key}
    environment: {NODE_ENV: production}
    networks: [services]
    volumes: [frontend_cache:/app/.next/cache]
    tmpfs: [/tmp:size=64m,mode=1777]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/quick-words').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  gateway:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    environment:
      SPEATION_PUBLIC_HOST: ${SPEATION_PUBLIC_HOST:?Set the public DNS hostname}
    volumes:
      - ./nginx/production.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${SPEATION_TLS_DIR:?Set the directory containing fullchain.pem and privkey.pem}:/etc/nginx/tls:ro
    networks: [services]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}

networks:
  services: {}
volumes:
  private_audio: {}
  frontend_cache: {}
